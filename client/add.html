    <hr>
  </header>

  <main class="add-content">
    <h1>Add New Game Item</h1>
    <p>Use this form to create a new generator, upgrade, or consumable for InfraClicker.</p>

    <form action="#" method="POST" class="item-form">
      
      <div class="field">
        <label for="item-name">Item Name:</label>
        <input type="text" id="item-name" name="itemName" required minlength="3" maxlength="30" placeholder="ex. Ultra Clicker">
      </div>

      <div class="field">
        <label for="item-type">Item Category:</label>
        <select id="item-type" name="itemType" required>
          <option value="">-- Select Category --</option>
          <option value="generator">Generator</option>
          <option value="consumable">Consumable Status Effect</option>
          <option value="upgrade">Passive Upgrade</option>
        </select>
      </div>

      <div class="field">
        <label for="base-cost">Base Cost (Units):</label>
        <input type="number" id="base-cost" name="baseCost" required min="1" max="1000000" placeholder="ex: 50">
      </div>

      <div class="field">
        <label for="cycle-time">Cycle Time (Seconds):</label>
        <input type="number" id="cycle-time" name="cycleTime" required min="0.1" max="60" step="0.1" placeholder="ex: 2.5">
      </div>

      <div class="field">
        <label for="item-description">Description:</label>
        <textarea id="item-description" name="itemDescription" rows="4" maxlength="200" placeholder="Describe item's function and impact on gameplay or anything else"></textarea>
      </div>

      <button type="submit" class="submit-btn">Add Generator</button>

    </form>
  </main>
